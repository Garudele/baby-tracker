name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'twa-manifest.json'
      - 'scripts/build-apk.mjs'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Install Android build-tools + platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Install @bubblewrap/core
        run: npm install --no-save @bubblewrap/core@latest

      - name: Restore or generate signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "::notice::Usando keystore desde secret"
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "ks_new=false" >> "$GITHUB_OUTPUT"
            echo "::add-mask::$KEYSTORE_PASS"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No hay keystore en secrets. Generando uno NUEVO — guárdalo desde los artifacts o no podrás actualizar el APK."
            PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Baby Tracker, O=Personal, C=MX"
            echo "$PASS" > keystore-password.txt
            echo "ks_new=true" >> "$GITHUB_OUTPUT"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: node scripts/build-apk.mjs

      - name: Get signing fingerprint (para assetlinks.json)
        run: |
          keytool -list -v -keystore android.keystore -alias android \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            | grep -E "SHA-?256:" > apk-fingerprint.txt || true
          cat apk-fingerprint.txt || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baby-tracker-apk
          path: |
            app-release-signed.apk
            apk-fingerprint.txt
          retention-days: 90

      - name: Upload keystore (PRIMERA BUILD — GUARDAR)
        if: steps.keystore.outputs.ks_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-GUARDAR-O-NO-PODRAS-ACTUALIZAR
          path: |
            android.keystore
            keystore-password.txt
          retention-days: 7
